[project]
name = "legrag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "arabic-reshaper>=3.0.0",
    "chromadb>=1.5.9",
    "docling>=2.126.0",
    "langchain>=1.4.2",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.2",
    "langchain-postgres>=0.0.18",
    "langchain-text-splitters>=1.1.2",
    "pdf-oxide>=0.3.77",
    "pdfplumber>=0.11.10",
    "psycopg2-binary>=2.9.13",
    "pymupdf>=1.24.0",
    "pypdfium2>=5.13.0",
    "python-bidi>=0.6.11",
]

[tool.uv]
package = true


[project.scripts]
legrag-ingest = "legrag.ingestion.pipeline:main"

[tool.pyright]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
