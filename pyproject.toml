[project]
name = "legrag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.143.0",
    "pydantic-ai>=2.55.0",
    "pydantic-settings>=2.15.0",
    "requests>=2.34.2",
    "uvicorn>=0.53.0",
]

[tool.uv]
package = true

[tool.pyright]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "datasets>=4.5.0",
    "docling>=2.126.0",
    "dvc>=3.64.2",
    "langchain-openai>=1.6.2",
    "mlflow>=3.8.1",
    "pytest>=9.1.1",
    "pyright>=1.1.407",
    "pyyaml>=6.0.3",
    "ragas<0.4",
]
