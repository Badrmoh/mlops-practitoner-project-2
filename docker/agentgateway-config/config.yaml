# yaml-language-server: $schema=https://agentgateway.dev/schema/config
config:
  database:
    url: sqlite:///config/data.db
gateways:
  default:
    port: 4000
ui:
  gateways: default
llm:
  gateways: default
  models:
    - name: ollama-judge
      provider: ollama
      params:
        model: "$OLLAMA_MODEL"
        baseUrl: "$OLLAMA_BASE_URL/v1"

    - name: custom-judge
      provider:
        custom:
          formats:
            - type: completions
      params:
        model: "$CUSTOM_PROVIDER_MODEL"
        baseUrl: "$CUSTOM_PROVIDER_BASE_URL"
        apiKey: "$CUSTOM_PROVIDER_API_KEY"
