services:
  legrag-api:
    image: ghcr.io/badrmoh/mlops-practitoner-project-2/legrag:latest
    environment:
      - LEGRAG_EMBEDDING_BASE_URL
      - LEGRAG_EMBEDDING_MODEL
      - LEGRAG_LLM_BASE_URL
      - LEGRAG_LLM_API_KEY
      - LEGRAG_LLM_MODEL
      - LANGFUSE_PUBLIC_KEY
      - LANGFUSE_SECRET_KEY
      - LANGFUSE_BASE_URL
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
