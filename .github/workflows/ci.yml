name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test-build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint/typecheck
        run: >
          uv run pyright
          src
          tests
          dvc

      - name: Test
        run: uv run pytest

      - name: Download raw PDF
        run: |
          uv run python - <<'PY'
          from pathlib import Path

          import requests
          import yaml

          from legrag.config import REPO_ROOT, Settings

          raw_pdf_url = Settings().raw_pdf_url
          if not raw_pdf_url:
              print("raw_pdf_url is not set; skipping raw PDF download")
              raise SystemExit(0)

          with (REPO_ROOT / "dvc/params.yaml").open("r", encoding="utf-8") as fp:
              params = yaml.safe_load(fp) or {}

          raw_pdf_path = Path(params["preprocess"]["raw_pdf_path"])
          raw_pdf_path = raw_pdf_path if raw_pdf_path.is_absolute() else REPO_ROOT / raw_pdf_path
          raw_pdf_path.parent.mkdir(parents=True, exist_ok=True)

          response = requests.get(raw_pdf_url, timeout=120)
          response.raise_for_status()
          raw_pdf_path.write_bytes(response.content)
          print(f"Downloaded raw PDF to {raw_pdf_path}")
          PY

      - name: Rebuild index artifacts
        env:
          LEGRAG_EMBEDDING_BASE_URL: ${{ secrets.LEGRAG_EMBEDDING_BASE_URL }}
          LEGRAG_EMBEDDING_MODEL: ${{ secrets.LEGRAG_EMBEDDING_MODEL }}
          LEGRAG_EMBEDDING_API_KEY: ${{ secrets.LEGRAG_EMBEDDING_API_KEY }}
        run: uv run dvc --cd dvc repro preprocess chunk embed

      - name: Evaluate RAG faithfulness
        env:
          LEGRAG_EMBEDDING_BASE_URL: ${{ secrets.LEGRAG_EMBEDDING_BASE_URL }}
          LEGRAG_EMBEDDING_MODEL: ${{ secrets.LEGRAG_EMBEDDING_MODEL }}
          LEGRAG_EMBEDDING_API_KEY: ${{ secrets.LEGRAG_EMBEDDING_API_KEY }}
          LEGRAG_LLM_BASE_URL: ${{ secrets.LEGRAG_LLM_BASE_URL }}
          LEGRAG_LLM_API_KEY: ${{ secrets.LEGRAG_LLM_API_KEY }}
        run: uv run dvc --cd dvc repro eval
        

      - name: Gate RAGAS faithfulness
        run: >
          uv run python -c
          "import json; m=json.load(open('data/output/ragas_metrics.json')); score=float(m['ragas_faithfulness']); assert score >= 0.75, f'RAGAS faithfulness {score:.3f} < 0.75'"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        if: github.event_name != 'push'
        run: docker buildx bake -f docker-bake.hcl app

      - name: Build and push Docker image
        if: github.event_name == 'push'
        run: >
          docker buildx bake -f docker-bake.hcl app --push
          --set app.tags=ghcr.io/${{ github.repository }}/legrag:${{ github.sha }},ghcr.io/${{ github.repository }}/legrag:latest
